services:
  db:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: mongosh --eval "rs.status()" --quiet
      interval: 5s
      timeout: 5s
      retries: 10
  mongo-init:
    image: mongo:7
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    entrypoint: ["mongosh", "--host", "db", "--eval", "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) } catch(e) { if (e.codeName !== 'AlreadyInitialized') throw e }"]
volumes:
  mongodata:
